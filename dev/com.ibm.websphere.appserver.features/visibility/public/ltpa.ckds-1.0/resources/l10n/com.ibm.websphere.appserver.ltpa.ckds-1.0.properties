description=This feature enables LTPA key encryption using z/OS CKDS (Cryptographic Key Data Set) \
with hardware cryptographic operations via the IBMJCECCA provider. This provides enhanced security \
by storing encryption keys in hardware-protected storage and performing crypto operations using \
z/OS Crypto Express hardware. This feature is only supported on z/OS systems with ICSF and CKDS configured.